## Minimal stack for Grafana dashboard screenshot capture.
##
## Services started:
##   timescaledb   – empty but connectable PostgreSQL/TimescaleDB instance
##   db-migrations – applies schema.sql + all SQL migrations so that all
##                   tables and reporting views exist before Grafana connects
##   renderer      – Grafana Image Renderer sidecar (headless Chrome)
##   grafana       – loads provisioned dashboards; depends on db-migrations
##
## After the stack is healthy, run:
##   python scripts/seed_screenshot_db.py   # load fixture data
##   python scripts/capture_dashboard_screenshots.py
##
## Tear down:
##   docker compose -f docker-compose.screenshots.yml down -v

services:
  # -----------------------------------------------------------------------
  # TimescaleDB – provides an empty but connectable datasource for Grafana
  # -----------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: screenshot-timescaledb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devops_screenshots
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d devops_screenshots"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - screenshot-net

  # -----------------------------------------------------------------------
  # DB Migrations – applies schema.sql + all migrations so all tables and
  # reporting views exist before Grafana (or the seed script) connects.
  # Uses the same Dockerfile.migrations as the main compose stack.
  # -----------------------------------------------------------------------
  db-migrations:
    build:
      context: .
      dockerfile: Dockerfile.migrations
    container_name: screenshot-db-migrations
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devops_screenshots
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: "5432"
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - screenshot-net

  # -----------------------------------------------------------------------
  # Grafana Image Renderer – renders Grafana panels to PNG via HTTP
  # -----------------------------------------------------------------------
  renderer:
    image: grafana/grafana-image-renderer:3.11.6
    container_name: screenshot-renderer
    environment:
      ENABLE_METRICS: "true"
      HTTP_PORT: "8081"
    networks:
      - screenshot-net

  # -----------------------------------------------------------------------
  # Grafana – loads provisioned dashboards; anonymous admin access enabled
  # -----------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.0.0
    container_name: screenshot-grafana
    environment:
      # Admin / auth
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      # Image renderer sidecar
      GF_RENDERING_SERVER_URL: "http://renderer:8081/render"
      GF_RENDERING_CALLBACK_URL: "http://grafana:3000/"
      GF_LOG_FILTERS: "rendering:debug"
      # Datasource credentials (pointing at the empty screenshot DB)
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devops_screenshots
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      timescaledb:
        condition: service_healthy
      db-migrations:
        condition: service_completed_successfully
      renderer:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q '\"database\": \"ok\"'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - screenshot-net

networks:
  screenshot-net:
    driver: bridge
