[tool.pytest.ini_options]
# Test discovery patterns
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Coverage options - commented out by default, run with --cov flag
# addopts = [
#     # Verbose output
#     "-v",
#     # Show local variables in tracebacks
#     "-l",
#     # Show summary of all test outcomes
#     "-ra",
#     # Coverage options (when running with --cov)
#     "--cov=src",
#     "--cov-report=html",
#     "--cov-report=term-missing",
#     "--cov-report=xml",
#     # Fail if coverage is below 70%
#     "--cov-fail-under=70",
# ]

# Base test options (always run)
addopts = [
    "-v",
    "-l",
    "-ra",
]

# Markers for categorizing tests
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "live_api: marks tests that hit real external APIs (GitHub, OSV.dev, etc.)",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/venv/*",
    "*/env/*",
    "*/.venv/*",
]

[tool.coverage.report]
show_missing = true
precision = 2
sort = "Cover"
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
    "pass",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
