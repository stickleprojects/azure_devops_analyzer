## Manual trigger for the full pipeline E2E test suite.
##
## Runs tests/contract/database/test_full_pipeline_e2e.py against a fresh
## TimescaleDB instance — no live API credentials required.
##
## Trigger: workflow_dispatch only (Actions → "Run workflow" button).

name: E2E Pipeline Tests

on:
  workflow_dispatch:

jobs:
  e2e:
    name: Full Pipeline E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_azure_devops
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Create test environment file
        run: |
          cat > .env.test << 'EOF'
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=test_azure_devops
          TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_azure_devops
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_azure_devops
          EOF

      - name: Enable TimescaleDB extension
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres -d test_azure_devops -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS timescaledb;"
          psql -h localhost -p 5432 -U postgres -d test_azure_devops -v ON_ERROR_STOP=1 \
            -c "SELECT extname, extversion FROM pg_extension WHERE extname = 'timescaledb';"

      - name: Run database migrations
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_azure_devops
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_azure_devops
        run: bash docker/scripts/run_migrations.sh

      - name: Run full pipeline E2E tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.REPO_ANALYZER_GITHUB_TOKEN || github.token }}
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_azure_devops
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_azure_devops
        run: |
          pytest tests/contract/database/test_full_pipeline_e2e.py \
            -v --tb=short --durations=10 -m "not live_api"
