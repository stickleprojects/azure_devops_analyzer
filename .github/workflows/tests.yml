## NOTE: Keep this workflow in sync with scripts/run-tests-docker.sh.
## The default local runner path should mirror this job's test order and env.
name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate root documentation
        run: |
          bash scripts/validate-documentation.sh README.md

      - name: Validate docs tree
        run: |
          bash scripts/validate-documentation.sh docs

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install mypy
        run: |
          python -m pip install --upgrade pip
          pip install "$(grep -E '^mypy' requirements.txt)"

      - name: Run mypy
        run: mypy   # config in pyproject.toml [tool.mypy]: files=["src"], ignore_missing_imports

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install "$(grep -E '^flake8' requirements.txt)" "$(grep -E '^pylint' requirements.txt)"

      - name: Run flake8
        run: flake8 src/   # config in .flake8: select = F,E9 (real bugs; style deferred to a black pass)

      - name: Run pylint (errors only)
        # --errors-only catches genuine errors without the noisy convention/refactor
        # categories; E0401 (import-error) is disabled because third-party deps are
        # not installed in the lint env, mirroring mypy's ignore_missing_imports.
        run: pylint src/ --errors-only --disable=E0401

  test:
    name: CI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_azure_devops
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine test scope
        id: test_scope
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # Get changed files in PR
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          elif [ "${{ job.status }}" == "failure" ]; then
            echo "✗ Tests failed"
            exit 1
          else
            # Get changed files in push
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }})
          fi

          # Python test scope includes core code plus DB/schema/migration and CI plumbing
          # that can affect runtime behavior without changing .py files.
          PYTHON_CHANGES=$(echo "$CHANGED_FILES" | grep -E '(^|/)src/|(^|/)tests/|\.py$|(^|/)database/|\.sql$|(^|/)docker/scripts/|(^|/)scripts/run-tests-docker\.sh$|(^|/)scripts/run_migrations\.sh$|(^|/)requirements\.txt$|(^|/)pyproject\.toml$|(^|/)docker-compose\.test\.yml$|^\.github/workflows/tests\.yml$|^\.github/workflows/e2e-pipeline-tests\.yml$' | wc -l)
          BATS_CHANGES=$(echo "$CHANGED_FILES" | grep -E '\.(sh|bash|bats)$' | wc -l)

          if [ "$PYTHON_CHANGES" -gt 0 ]; then
            echo "run_python=true" >> $GITHUB_OUTPUT
          else
            echo "run_python=false" >> $GITHUB_OUTPUT
          fi

          if [ "$BATS_CHANGES" -gt 0 ]; then
            echo "run_bats=true" >> $GITHUB_OUTPUT
          else
            echo "run_bats=false" >> $GITHUB_OUTPUT
          fi

          if [ "$PYTHON_CHANGES" -eq 0 ] && [ "$BATS_CHANGES" -eq 0 ]; then
            echo "skip_tests=true" >> $GITHUB_OUTPUT
            echo "✓ No Python or shell changes - skipping tests"
          else
            echo "skip_tests=false" >> $GITHUB_OUTPUT
            echo "✓ Relevant changes detected - running tests"
          fi

      - name: Set up Node.js
        if: steps.test_scope.outputs.run_bats == 'true' && github.event_name == 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        if: steps.test_scope.outputs.run_bats == 'true' && github.event_name == 'pull_request'
        run: |
          npm ci

      - name: Run startup script bats tests
        if: steps.test_scope.outputs.run_bats == 'true' && github.event_name == 'pull_request'
        run: |
          npx bats startup-scripts/tests/*.bats

      - name: Set up Python
        if: steps.test_scope.outputs.run_python == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        if: steps.test_scope.outputs.run_python == 'true'
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Create test environment file
        if: steps.test_scope.outputs.run_python == 'true'
        run: |
          cat > .env.test << 'EOF'
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=test_azure_devops
          TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_azure_devops
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_azure_devops
          EOF

      - name: Ensure TimescaleDB extension is available
        if: steps.test_scope.outputs.run_python == 'true'
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres -d test_azure_devops -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS timescaledb;"
          psql -h localhost -p 5432 -U postgres -d test_azure_devops -v ON_ERROR_STOP=1 -c "SELECT extname, extversion FROM pg_extension WHERE extname = 'timescaledb';"

      - name: Run database migrations
        if: steps.test_scope.outputs.run_python == 'true'
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_azure_devops
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_azure_devops
        run: |
          bash docker/scripts/run_migrations.sh

      # - name: Run live API tests
      #   if: steps.test_scope.outputs.run_python == 'true'
      #   env:
      #     PYTHONPATH: ${{ github.workspace }}
      #     GITHUB_TOKEN: ${{ secrets.REPO_ANALYZER_GITHUB_TOKEN }}
      #     GITHUB_PRIVATE_REPO: stickleprojects/azure_devops_analyzer
      #     AZURE_DEVOPS_PAT: ${{ secrets.REPO_ANALYZER_DEVOPS_PAT }}
      #     AZURE_DEVOPS_ORG_URL: https://dev.azure.com/kieronwray
      #     TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_azure_devops
      #     DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_azure_devops
      #   run: |
      #     if [ -n "$GITHUB_TOKEN" ] && [ -n "$AZURE_DEVOPS_PAT" ] && [ -n "$AZURE_DEVOPS_ORG_URL" ]; then
      #       echo "Running live API tests with provided credentials..."
      #       pytest tests/contract/integration/ -v --tb=short --durations=10 -m "live_api"
      #     elif [ "${{ job.status }}" == "failure" ]; then
      #       echo "✗ Tests failed"
      #       exit 1
      #     else
      #       echo "Skipping live API tests - credentials not available"
      #     fi

      - name: Run tests and generate coverage report
        if: steps.test_scope.outputs.run_python == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.REPO_ANALYZER_GITHUB_TOKEN }}
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_azure_devops
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_azure_devops
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_azure_devops
        run: |
          mkdir -p test-results
          pytest tests/ -v --tb=short --durations=10 -m "not live_api" -p no:cacheprovider --cov=src --cov-report=xml:test-results/coverage.xml --cov-report=term-missing
      - name: Report test status
        if: always()
        run: |
          if [ "${{ steps.test_scope.outputs.skip_tests }}" == "true" ]; then
            echo "✓ Tests skipped - no relevant changes"
            exit 0
          elif [ "${{ job.status }}" == "failure" ]; then
            echo "✗ Tests failed"
            exit 1
          else
            echo "✓ Tests completed successfully"
            exit 0
          fi