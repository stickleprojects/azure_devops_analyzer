name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: CI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_azure_devops
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine test scope
        id: test_scope
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # Get changed files in PR
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          elif [ "${{ job.status }}" == "failure" ]; then
            echo "✗ Tests failed"
            exit 1
          else
            # Get changed files in push
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }})
          fi

          PYTHON_CHANGES=$(echo "$CHANGED_FILES" | grep -E '\.py$' | wc -l)
          BATS_CHANGES=$(echo "$CHANGED_FILES" | grep -E '\.(sh|bash|bats)$' | wc -l)

          if [ "$PYTHON_CHANGES" -gt 0 ]; then
            echo "run_python=true" >> $GITHUB_OUTPUT
          else
            echo "run_python=false" >> $GITHUB_OUTPUT
          fi

          if [ "$BATS_CHANGES" -gt 0 ]; then
            echo "run_bats=true" >> $GITHUB_OUTPUT
          else
            echo "run_bats=false" >> $GITHUB_OUTPUT
          fi

          if [ "$PYTHON_CHANGES" -eq 0 ] && [ "$BATS_CHANGES" -eq 0 ]; then
            echo "skip_tests=true" >> $GITHUB_OUTPUT
            echo "✓ No Python or shell changes - skipping tests"
          else
            echo "skip_tests=false" >> $GITHUB_OUTPUT
            echo "✓ Relevant changes detected - running tests"
          fi

      - name: Set up Node.js
        if: steps.test_scope.outputs.run_bats == 'true' && github.event_name == 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        if: steps.test_scope.outputs.run_bats == 'true' && github.event_name == 'pull_request'
        run: |
          npm ci

      - name: Run startup script bats tests
        if: steps.test_scope.outputs.run_bats == 'true' && github.event_name == 'pull_request'
        run: |
          npx bats startup-scripts/tests/*.bats

      - name: Set up Python
        if: steps.test_scope.outputs.run_python == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        if: steps.test_scope.outputs.run_python == 'true'
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Create test environment file
        if: steps.test_scope.outputs.run_python == 'true'
        run: |
          cat > .env.test << 'EOF'
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=test_azure_devops
          TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_azure_devops
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_azure_devops
          EOF

      - name: Run database migrations
        if: steps.test_scope.outputs.run_python == 'true'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_azure_devops
        run: |
          bash docker/scripts/run_migrations.sh || true

      - name: Run unit tests
        if: steps.test_scope.outputs.run_python == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        if: steps.test_scope.outputs.run_python == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_azure_devops
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_azure_devops
        run: |
          pytest tests/contract/integration/ -v --tb=short --durations=10 -m "not live_api"

      - name: Run live API tests
        if: steps.test_scope.outputs.run_python == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.LIVE_GITHUB_TOKEN }}
          GITHUB_PRIVATE_REPO: stickleprojects/azure_devops_analyzer
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
          AZURE_DEVOPS_ORG_URL: https://dev.azure.com/kieronwray
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_azure_devops
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_azure_devops
        run: |
          if [ -n "$GITHUB_TOKEN" ] && [ -n "$AZURE_DEVOPS_PAT" ] && [ -n "$AZURE_DEVOPS_ORG_URL" ]; then
            echo "Running live API tests with provided credentials..."
            pytest tests/contract/integration/ -v --tb=short --durations=10 -m "live_api"
          elif [ "${{ job.status }}" == "failure" ]; then
            echo "✗ Tests failed"
            exit 1
          else
            echo "Skipping live API tests - credentials not available"
          fi

      - name: Generate coverage report
        if: steps.test_scope.outputs.run_python == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/ --cov=src --cov-report=xml --cov-report=term-missing -m "not live_api"
      - name: Report test status
        if: always()
        run: |
          if [ "${{ steps.test_scope.outputs.skip_tests }}" == "true" ]; then
            echo "✓ Tests skipped - no relevant changes"
            exit 0
          elif [ "${{ job.status }}" == "failure" ]; then
            echo "✗ Tests failed"
            exit 1
          else
            echo "✓ Tests completed successfully"
            exit 0
          fi