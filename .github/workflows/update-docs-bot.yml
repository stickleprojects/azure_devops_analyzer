## Update-Docs Bot
##
## Manual workflow that can run documentation audit, dashboard screenshot refresh,
## and Mermaid SVG refresh in one orchestrated run. Any enabled tasks are
## aggregated into a single bot branch and a single pull request.

name: Update-Docs Bot

on:
  workflow_dispatch:
    inputs:
      run_audit:
        description: 'Run documentation audit'
        required: false
        default: true
        type: boolean
      dry_run:
        description: 'Audit: generate report but do not open a PR'
        required: false
        default: false
        type: boolean
      run_screenshots:
        description: 'Capture dashboard screenshots'
        required: false
        default: true
        type: boolean
      capture_all:
        description: 'Screenshots: capture ALL dashboards (ignore git diff)'
        required: false
        default: false
        type: boolean
      base_ref:
        description: 'Screenshots: git ref to diff against for change detection (default: HEAD~1)'
        required: false
        default: 'HEAD~1'
        type: string
      width:
        description: 'Screenshots: width in pixels'
        required: false
        default: '1280'
        type: string
      height:
        description: 'Screenshots: height in pixels'
        required: false
        default: '800'
        type: string
      run_mermaid:
        description: 'Render Mermaid diagrams to SVG'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-docs-bot
  cancel-in-progress: false

jobs:
  update_docs:
    name: Run Selected Docs Updates
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run documentation audit
        if: inputs.run_audit
        id: audit
        run: |
          mkdir -p artifacts/doc-audit
          python scripts/doc_audit.py --output artifacts/doc-audit/report.md

          ERRORS=$(grep -c "^- ❌" artifacts/doc-audit/report.md || true)
          WARNINGS=$(grep -c "^- ⚠️" artifacts/doc-audit/report.md || true)

          if [ "$ERRORS" -gt 0 ] || [ "$WARNINGS" -gt 0 ]; then
            HAS_FINDINGS=true
          else
            HAS_FINDINGS=false
          fi

          echo "errors=$ERRORS" >> "$GITHUB_OUTPUT"
          echo "warnings=$WARNINGS" >> "$GITHUB_OUTPUT"
          echo "has_findings=$HAS_FINDINGS" >> "$GITHUB_OUTPUT"

      - name: Upload audit report artifact
        if: inputs.run_audit
        uses: actions/upload-artifact@v4
        with:
          name: doc-audit-report
          path: artifacts/doc-audit/report.md
          retention-days: 30

      - name: Start screenshot stack
        if: inputs.run_screenshots
        run: |
          docker compose -f docker-compose.screenshots.yml up -d
          echo "Waiting for screenshot-db-migrations to finish..."
          timeout 120 bash -c '
            until [ "$(docker inspect --format="{{.State.Status}}" screenshot-db-migrations 2>/dev/null)" = "exited" ]; do
              sleep 3
            done
            EXIT_CODE=$(docker inspect --format="{{.State.ExitCode}}" screenshot-db-migrations)
            echo "db-migrations exited with code $EXIT_CODE"
            exit $EXIT_CODE
          '

      - name: Install screenshot dependencies
        if: inputs.run_screenshots
        run: pip install -r requirements.txt --quiet

      - name: Seed screenshot database
        if: inputs.run_screenshots
        run: |
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/devops_screenshots"
          export PYTHONPATH="${PYTHONPATH}:$(pwd)"
          python scripts/seed_screenshot_db.py

      - name: Capture dashboard screenshots
        if: inputs.run_screenshots
        id: screenshots
        run: |
          EXTRA_FLAGS=""
          if [ "${{ inputs.capture_all }}" = "true" ]; then
            EXTRA_FLAGS="--all"
          fi

          python scripts/capture_dashboard_screenshots.py \
            --grafana-url http://localhost:3000 \
            --wait-timeout 120 \
            --base-ref "${{ inputs.base_ref }}" \
            --width "${{ inputs.width }}" \
            --height "${{ inputs.height }}" \
            $EXTRA_FLAGS

          COUNT=$(find docs/images/dashboards -name '*.png' | wc -l)
          echo "screenshot_count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Tear down screenshot stack
        if: always() && inputs.run_screenshots
        run: docker compose -f docker-compose.screenshots.yml down -v --remove-orphans

      - name: Upload screenshots artifact
        if: inputs.run_screenshots && steps.screenshots.outputs.screenshot_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-screenshots
          path: docs/images/dashboards/*.png
          retention-days: 30

      - name: Install Mermaid CLI
        if: inputs.run_mermaid
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Render Mermaid diagrams
        if: inputs.run_mermaid
        id: mermaid
        run: |
          COUNT=0
          while IFS= read -r -d '' mmd_file; do
            svg_file="${mmd_file%.mmd}.svg"
            echo "Rendering: $mmd_file -> $svg_file"
            mmdc -i "$mmd_file" -o "$svg_file" --backgroundColor transparent
            COUNT=$((COUNT + 1))
          done < <(find docs -name '*.mmd' -print0)

          echo "diagram_count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Configure git identity
        if: inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and push combined changes
        if: inputs.dry_run != true
        id: publish
        run: |
          BRANCH="bot/update-docs-${GITHUB_RUN_ID}"
          TODAY="$(date +%Y-%m-%d)"

          git checkout -B "$BRANCH"

          if [ "${{ inputs.run_audit }}" != "false" ] && [ -f artifacts/doc-audit/report.md ]; then
            git add artifacts/doc-audit/report.md
          fi

          if [ "${{ inputs.run_screenshots }}" != "false" ] && [ -d docs/images/dashboards ]; then
            while IFS= read -r -d '' png_file; do
              git add "$png_file"
            done < <(find docs/images/dashboards -name '*.png' -print0)
          fi

          if [ "${{ inputs.run_mermaid }}" != "false" ]; then
            while IFS= read -r -d '' svg_file; do
              git add "$svg_file"
            done < <(find docs -name '*.svg' -print0)
          fi

          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          AUDIT_ERRORS="${{ steps.audit.outputs.errors || '0' }}"
          AUDIT_WARNINGS="${{ steps.audit.outputs.warnings || '0' }}"
          SCREENSHOT_COUNT="${{ steps.screenshots.outputs.screenshot_count || '0' }}"
          MERMAID_COUNT="${{ steps.mermaid.outputs.diagram_count || '0' }}"

          git commit -m "docs(bot): refresh docs artifacts ${TODAY} (audit:${AUDIT_ERRORS}/${AUDIT_WARNINGS}, screenshots:${SCREENSHOT_COUNT}, mermaid:${MERMAID_COUNT})"
          git push --force-with-lease origin "$BRANCH"

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open or update combined pull request
        if: inputs.dry_run != true && steps.publish.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.publish.outputs.branch }}"
          TODAY="$(date +%Y-%m-%d)"

          if [ "${{ inputs.run_audit }}" = "false" ]; then
            AUDIT_SUMMARY="- skipped"
          else
            AUDIT_SUMMARY="- findings: ${{ steps.audit.outputs.errors || '0' }} error(s), ${{ steps.audit.outputs.warnings || '0' }} warning(s)"
          fi

          if [ "${{ inputs.run_screenshots }}" = "false" ]; then
            SCREENSHOT_SUMMARY="- skipped"
          else
            SCREENSHOT_SUMMARY="- screenshots present in docs/images/dashboards/: ${{ steps.screenshots.outputs.screenshot_count || '0' }}"
          fi

          if [ "${{ inputs.run_mermaid }}" = "false" ]; then
            MERMAID_SUMMARY="- skipped"
          else
            MERMAID_SUMMARY="- diagrams rendered from .mmd sources: ${{ steps.mermaid.outputs.diagram_count || '0' }}"
          fi

          PR_BODY=$(cat <<EOF
          ## Update-Docs Bot Consolidated Refresh - ${TODAY}

          This PR was generated from a single Update-Docs Bot workflow run.

          ### Documentation audit
          ${AUDIT_SUMMARY}

          ### Dashboard screenshots
          ${SCREENSHOT_SUMMARY}

          ### Mermaid diagrams
          ${MERMAID_SUMMARY}

          ### Notes
          - This workflow now opens one combined PR per run.
          - Branch is unique per run to avoid collisions.
          EOF
          )

          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null || true)

          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "docs(bot): consolidated docs refresh ${TODAY}" --body "$PR_BODY"
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "docs(bot): consolidated docs refresh ${TODAY}" \
              --body "$PR_BODY" \
              --label "documentation" || \
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "docs(bot): consolidated docs refresh ${TODAY}" \
              --body "$PR_BODY"
          fi

      - name: Print summary
        if: always()
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run complete. No branch or PR was created."
            exit 0
          fi

          if [ "${{ steps.publish.outputs.has_changes || 'false' }}" = "true" ]; then
            echo "Update-Docs Bot complete: combined branch and PR were created or updated."
            echo "Branch: ${{ steps.publish.outputs.branch }}"
          else
            echo "Update-Docs Bot complete: no file changes detected, no PR created."
          fi
