## Refresh Dashboard Screenshots (Manual)
##
## Spins up a minimal Grafana + Image Renderer stack, captures a PNG
## screenshot for each dashboard whose JSON has changed since the previous
## commit (or all dashboards when "capture_all" is selected), then opens
## a pull-request with the updated images for review.
##
## This workflow NEVER commits directly to main – all changes land on a
## bot branch and require PR approval before merging.
##
## Triggers: workflow_dispatch only (fully manual)
##
## Inputs:
##   capture_all  – set to true to re-capture every dashboard regardless of
##                  git-diff status (useful after major Grafana version bumps)
##   base_ref     – git ref to diff against when detecting changed dashboards
##                  (default: HEAD~1; use a specific SHA for precision)
##   width        – screenshot width  in pixels (default: 1280)
##   height       – screenshot height in pixels (default: 800)

name: Refresh Dashboard Screenshots

on:
  workflow_dispatch:
    inputs:
      capture_all:
        description: 'Capture ALL dashboards (ignore git diff)'
        required: false
        default: 'false'
        type: boolean
      base_ref:
        description: 'Git ref to diff against for change detection (default: HEAD~1)'
        required: false
        default: 'HEAD~1'
        type: string
      width:
        description: 'Screenshot width in pixels'
        required: false
        default: '1280'
        type: string
      height:
        description: 'Screenshot height in pixels'
        required: false
        default: '800'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  screenshots:
    name: Capture Dashboard Screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout with full history so git-diff works correctly
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # 2. Set up Python (stdlib only – no extra packages needed)
      # -----------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # -----------------------------------------------------------------------
      # 3. Start the screenshot stack (Grafana + renderer + TimescaleDB +
      #    db-migrations).  db-migrations applies schema + all SQL views so
      #    the database is query-ready before we seed or capture.
      # -----------------------------------------------------------------------
      - name: Start screenshot stack
        run: |
          docker compose -f docker-compose.screenshots.yml up -d
          echo "⏳ Stack started – waiting for db-migrations to complete …"
          # Block until the migration container exits successfully
          timeout 120 bash -c '
            until [ "$(docker inspect --format="{{.State.Status}}" screenshot-db-migrations 2>/dev/null)" = "exited" ]; do
              sleep 3
            done
            EXIT_CODE=$(docker inspect --format="{{.State.ExitCode}}" screenshot-db-migrations)
            echo "db-migrations exited with code $EXIT_CODE"
            exit $EXIT_CODE
          '

      # -----------------------------------------------------------------------
      # 4. Install Python dependencies then seed the database with fixture data.
      #    The seed script uses the same FixtureExtractor + store_* functions as
      #    the e2e tests, so every view is populated with tested, realistic data.
      # -----------------------------------------------------------------------
      - name: Install Python dependencies
        run: pip install -r requirements.txt --quiet

      - name: Seed database with fixture data
        run: |
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/devops_screenshots"
          export PYTHONPATH="${PYTHONPATH}:$(pwd)"
          python scripts/seed_screenshot_db.py

      # -----------------------------------------------------------------------
      # 5. Run the capture script
      # -----------------------------------------------------------------------
      - name: Capture dashboard screenshots
        id: capture
        run: |
          EXTRA_FLAGS=""
          if [ "${{ inputs.capture_all }}" == "true" ]; then
            EXTRA_FLAGS="--all"
          fi

          python scripts/capture_dashboard_screenshots.py \
            --grafana-url http://localhost:3000 \
            --wait-timeout 120 \
            --base-ref "${{ inputs.base_ref }}" \
            --width "${{ inputs.width }}" \
            --height "${{ inputs.height }}" \
            $EXTRA_FLAGS

          # Count how many PNGs were written
          COUNT=$(find docs/images/dashboards -name '*.png' | wc -l)
          echo "screenshot_count=$COUNT" >> $GITHUB_OUTPUT

      # -----------------------------------------------------------------------
      # 6. Tear down the stack regardless of capture outcome
      # -----------------------------------------------------------------------
      - name: Tear down screenshot stack
        if: always()
        run: |
          docker compose -f docker-compose.screenshots.yml down -v --remove-orphans

      # -----------------------------------------------------------------------
      # 7. Upload screenshots as a workflow artifact for immediate inspection
      # -----------------------------------------------------------------------
      - name: Upload screenshots artifact
        if: steps.capture.outputs.screenshot_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-screenshots
          path: docs/images/dashboards/*.png
          retention-days: 30

      # -----------------------------------------------------------------------
      # 8. Commit and push the updated screenshots to a bot branch
      # -----------------------------------------------------------------------
      - name: Configure git identity
        if: steps.capture.outputs.screenshot_count != '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Push screenshots to bot branch
        if: steps.capture.outputs.screenshot_count != '0'
        id: push
        run: |
          BRANCH="bot/dashboard-screenshots-$(date +%Y-%m-%d)"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

          git checkout -B "$BRANCH"
          git add docs/images/dashboards/
          git commit -m "docs(bot): refresh dashboard screenshots $(date +%Y-%m-%d)"
          git push --force origin "$BRANCH"

      # -----------------------------------------------------------------------
      # 9. Open a pull-request for review
      # -----------------------------------------------------------------------
      - name: Open pull-request
        if: steps.capture.outputs.screenshot_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.push.outputs.branch }}"
          TODAY="$(date +%Y-%m-%d)"
          COUNT="${{ steps.capture.outputs.screenshot_count }}"
          ALL="${{ inputs.capture_all }}"
          BASE="${{ inputs.base_ref }}"

          if [ "$ALL" == "true" ]; then
            SCOPE="all dashboards (forced full refresh)"
          else
            SCOPE="dashboards that changed since \`${BASE}\`"
          fi

          PR_BODY="## Dashboard Screenshot Refresh – ${TODAY}

This pull request was automatically created by the **Refresh Dashboard Screenshots**
workflow after capturing updated PNG screenshots for ${SCOPE}.

**Screenshots updated**: ${COUNT}

### What to do

1. Review the updated screenshots in \`docs/images/dashboards/\`
2. If the screenshots look correct, approve and merge this PR
3. If something looks wrong (panel errors, layout issues), investigate the
   dashboard JSON or the Grafana provisioning configuration

### Screenshots included

$(find docs/images/dashboards -name '*.png' -exec basename {} .png \; | sort | sed 's/^/- `/' | sed 's/$/`/')

---

_Screenshots were captured using Grafana's Image Renderer API against a
TimescaleDB instance seeded with data from the project's e2e fixture scenarios,
so panels show realistic commit trends, PR distributions, and security metrics._

_To re-run: Actions → Refresh Dashboard Screenshots → Run workflow_"

          # Avoid duplicate PRs for the same day
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number \
                     --jq '.[0].number' 2>/dev/null || true)

          if [ -n "$EXISTING" ]; then
            echo "PR #${EXISTING} already open for branch ${BRANCH} – updating body"
            gh pr edit "$EXISTING" --body "$PR_BODY"
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "docs(bot): dashboard screenshots ${TODAY}" \
              --body "$PR_BODY" \
              --label "documentation" || \
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "docs(bot): dashboard screenshots ${TODAY}" \
              --body "$PR_BODY"
          fi

      # -----------------------------------------------------------------------
      # 10. Final summary
      # -----------------------------------------------------------------------
      - name: Print summary
        if: always()
        run: |
          COUNT="${{ steps.capture.outputs.screenshot_count }}"
          if [ "${COUNT:-0}" -eq 0 ]; then
            echo "✅ No dashboards needed updating – nothing to commit."
          else
            echo "✅ ${COUNT} screenshot(s) captured and PR opened for review."
          fi
