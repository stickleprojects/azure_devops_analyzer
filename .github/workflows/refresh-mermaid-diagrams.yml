## Refresh Mermaid Diagrams (Manual)
##
## Renders every .mmd source file under docs/ to a matching .svg file using
## @mermaid-js/mermaid-cli, then opens a pull-request with the updated images
## for review.
##
## This workflow NEVER commits directly to main – all changes land on a
## bot branch and require PR approval before merging.
##
## Triggers: workflow_dispatch only (fully manual)

name: Refresh Mermaid Diagrams

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  render:
    name: Render Mermaid Diagrams
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout with full history
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # 2. Install @mermaid-js/mermaid-cli
      # -----------------------------------------------------------------------
      - name: Install mermaid-cli
        run: npm install -g @mermaid-js/mermaid-cli

      # -----------------------------------------------------------------------
      # 3. Render each .mmd file to a .svg alongside it
      # -----------------------------------------------------------------------
      - name: Render .mmd files to SVG
        id: render
        run: |
          COUNT=0
          while IFS= read -r -d '' mmd_file; do
            svg_file="${mmd_file%.mmd}.svg"
            echo "  Rendering: $mmd_file → $svg_file"
            mmdc -i "$mmd_file" -o "$svg_file" --backgroundColor transparent
            COUNT=$((COUNT + 1))
          done < <(find docs -name '*.mmd' -print0)

          echo "diagram_count=$COUNT" >> $GITHUB_OUTPUT
          echo "✅ Rendered $COUNT diagram(s)"

      # -----------------------------------------------------------------------
      # 4. Configure git identity for the bot commit
      # -----------------------------------------------------------------------
      - name: Configure git identity
        if: steps.render.outputs.diagram_count != '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # -----------------------------------------------------------------------
      # 5. Push updated SVGs to a bot branch
      # -----------------------------------------------------------------------
      - name: Push diagrams to bot branch
        if: steps.render.outputs.diagram_count != '0'
        id: push
        run: |
          BRANCH="bot/mermaid-diagrams-$(date +%Y-%m-%d)"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

          git checkout -B "$BRANCH"
          git add docs/**/*.svg
          git diff --cached --quiet && echo "No SVG changes – nothing to commit." && exit 0

          git commit -m "docs(bot): refresh Mermaid diagram SVGs $(date +%Y-%m-%d)"
          git push --force origin "$BRANCH"

      # -----------------------------------------------------------------------
      # 6. Open a pull-request for review
      # -----------------------------------------------------------------------
      - name: Open pull-request
        if: steps.render.outputs.diagram_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.push.outputs.branch }}"
          TODAY="$(date +%Y-%m-%d)"
          COUNT="${{ steps.render.outputs.diagram_count }}"

          PR_BODY="## Mermaid Diagram Refresh – ${TODAY}

This pull request was automatically created by the **Refresh Mermaid Diagrams**
workflow after re-rendering all \`.mmd\` source files to SVG.

**Diagrams rendered**: ${COUNT}

### What to do

1. Review the updated SVG files in \`docs/\`
2. If the diagrams look correct, approve and merge this PR
3. If something looks wrong, update the corresponding \`.mmd\` source file and
   re-run the workflow

### Diagrams included

$(find docs -name '*.mmd' -exec basename {} .mmd \; | sort | sed 's/^/- `/' | sed 's/$/`/')

---

_To re-run: Actions → Refresh Mermaid Diagrams → Run workflow_"

          # Avoid duplicate PRs for the same day
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number \
                     --jq '.[0].number' 2>/dev/null || true)

          if [ -n "$EXISTING" ]; then
            echo "PR #${EXISTING} already open for branch ${BRANCH} – updating body"
            gh pr edit "$EXISTING" --body "$PR_BODY"
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "docs(bot): Mermaid diagram refresh ${TODAY}" \
              --body "$PR_BODY" \
              --label "documentation" || \
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "docs(bot): Mermaid diagram refresh ${TODAY}" \
              --body "$PR_BODY"
          fi

      # -----------------------------------------------------------------------
      # 7. Final summary
      # -----------------------------------------------------------------------
      - name: Print summary
        if: always()
        run: |
          COUNT="${{ steps.render.outputs.diagram_count }}"
          if [ "${COUNT:-0}" -eq 0 ]; then
            echo "✅ No .mmd files found – nothing to render."
          else
            echo "✅ ${COUNT} diagram(s) rendered and PR opened for review."
          fi
