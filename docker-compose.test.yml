# =============================================================================
# Docker Compose Test Environment
# =============================================================================
# Fully isolated integration test environment with dedicated test database.
# This configuration creates a separate network and database instance to avoid
# interfering with development or production services.
#
# Usage:
#   ./scripts/run-tests-docker.sh
#   
# Or manually:
#   docker compose -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from test-runner
#   docker compose -f docker-compose.test.yml down -v
#
# Benefits:
#   - Complete isolation from development environment
#   - Clean database state for every test run
#   - In-memory database for faster execution
#   - Reproducible test results
#   - CI/CD ready
# =============================================================================

services:
  # ===========================================
  # Test Database - Isolated PostgreSQL/TimescaleDB
  # ===========================================
  test-db:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: analyzer-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test_azure_devops
      TIMESCALEDB_TELEMETRY: off
      # PostgreSQL tuning for 7.75GB RAM, 2 CPUs
      POSTGRES_MAX_CONNECTIONS: "100"
      POSTGRES_SHARED_BUFFERS: "1900MB"
      POSTGRES_EFFECTIVE_CACHE_SIZE: "5850MB"
      POSTGRES_WORK_MEM: "9MB"
      POSTGRES_MAINTENANCE_WORK_MEM: "475MB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d test_azure_devops"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - test-network
    # Use tmpfs for in-memory database (faster, destroyed after run)
    tmpfs:
      - /var/lib/postgresql/data
    # Uncomment for persistent test data debugging:
    # volumes:
    #   - test_db_data:/var/lib/postgresql/data

  # ===========================================
  # Test Migrations - Schema initialization
  # ===========================================
  test-migrations:
    build:
      context: .
      dockerfile: Dockerfile.migrations
    container_name: analyzer-test-migrations
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test_azure_devops
      POSTGRES_HOST: test-db
      POSTGRES_PORT: 5432
    volumes:
      # Mount schema and migrations at runtime for development (no rebuild needed)
      - ./database/schema.sql:/migrations/schema.sql:ro
      - ./database/migrations:/migrations/migrations:ro
    depends_on:
      test-db:
        condition: service_healthy
    networks:
      - test-network

  # ===========================================
  # Integration Test Runner
  # ===========================================
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: analyzer-test-runner
    command:
      - sh
      - -c
      - |
        pip install pytest pytest-cov pytest-asyncio pytest-mock && \
        pytest tests/unit/ \
               tests/contract/database/ \
               tests/contract/integration/ \
               -v \
               --tb=short \
               --durations=10 \
               -m 'not live_api' \
               --cov=src \
               --cov-report=term-missing \
                 --cov-report=xml:/app/test-results/coverage.xml \
               -p no:cacheprovider \
               --junit-xml=/app/test-results/junit.xml
    environment:
      # Test database connection (internal Docker network)
      # Note: Must match GitHub Actions credentials exactly
      TEST_DATABASE_URL: postgresql://postgres:postgres@test-db:5432/test_azure_devops
      DATABASE_URL: postgresql://postgres:postgres@test-db:5432/test_azure_devops
      POSTGRES_HOST: test-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test_azure_devops
      POSTGRES_PORT: 5432
      
      # GitHub SDK for tests (from host environment)
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_PRIVATE_REPO: ${GITHUB_PRIVATE_REPO}
      
      # Azure DevOps SDK for tests (optional, from host environment)
      AZURE_DEVOPS_ORG_URL: ${AZURE_DEVOPS_ORG_URL}
      AZURE_DEVOPS_PAT: ${AZURE_DEVOPS_PAT}
      AZURE_DEVOPS_ORG_NAME: ${AZURE_DEVOPS_ORG_NAME}
      
      # Test configuration
      LOG_LEVEL: DEBUG
      PYTHONPATH: /app
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONPYCACHEPREFIX: /tmp/pycache
      COVERAGE_FILE: /tmp/.coverage
    volumes:
      # Mount source code (read-only for safety)
      - ./tests:/app/tests:ro
      - ./src:/app/src
      - ./scripts:/app/scripts:ro
      - ./database:/app/database:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./.env.resolved:/app/.env.resolved:ro
      - ./.env:/app/.env:ro
      - ./src/.cache:/app/.cache
      # Export test results to host
      - ./test-results:/app/test-results
    depends_on:
      test-db:
        condition: service_healthy
      test-migrations:
        condition: service_completed_successfully
    networks:
      - test-network

# =============================================================================
# Optional: Live API Test Runner
# =============================================================================
# Uncomment to run tests that hit real external APIs (OSV.dev, endoflife.date)
#
#   test-runner-live-api:
#     extends: test-runner
#     container_name: analyzer-test-runner-live-api
#     command: >
#       sh -c "pip install pytest pytest-cov pytest-asyncio pytest-mock &&
#              pytest tests/contract/integration/ -v 
#              -m 'live_api' 
#              --junit-xml=/app/test-results/junit-live-api.xml 
#              --tb=short"

# =============================================================================
# Networks & Volumes
# =============================================================================
networks:
  test-network:
    driver: bridge
    name: analyzer-test-network

# Uncomment if you need persistent test data for debugging
# volumes:
#   test_db_data:
